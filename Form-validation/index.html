<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Theme Toggle Icon -->
  <div class="position-absolute top-0 end-0 m-3">
    <i class="bi bi-brightness-high-fill fs-4 text-light" id="themeIcon" onclick="toggleTheme()" style="cursor: pointer;"></i>
  </div>

  <!-- Registration Form -->
  <div class="form-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-lg p-4 form-card">
      <h2 class="text-center mb-4 text-gradient">📝 Register Now</h2>
      <form id="myForm" onsubmit="return validateForm()" novalidate>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="fullName" placeholder=" " onchange="validateName(); updateProgress();">
          <label for="fullName"><i class="bi bi-person-fill"></i> Full Name</label>
          <div class="invalid-feedback">Name must be at least 5 characters.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder=" " onchange="validateEmail(); updateProgress();">
          <label for="email"><i class="bi bi-envelope-fill"></i> Email</label>
          <div class="invalid-feedback">Invalid email address.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="phone" placeholder=" " onchange="validatePhone(); updateProgress();">
          <label for="phone"><i class="bi bi-telephone-fill"></i> Phone</label>
          <div class="invalid-feedback">Enter a valid 10-digit phone number.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" placeholder=" " onchange="validatePassword(); updateProgress();">
          <label for="password"><i class="bi bi-lock-fill"></i> Password</label>
          <div class="invalid-feedback">Password must be at least 8 characters and not your name.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="confirmPassword" placeholder=" " onchange="validateConfirmPassword(); updateProgress();">
          <label for="confirmPassword"><i class="bi bi-lock"></i> Confirm Password</label>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>

        <div class="progress mb-3" style="height: 8px;">
  <div class="progress-bar bg-success" role="progressbar" id="formProgress" style="width: 0%;"></div>
</div>
        <div id="errorMsg" class="text-danger mb-2 fw-bold"></div>
        <button class="btn btn-gradient w-100" type="submit">Submit</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
